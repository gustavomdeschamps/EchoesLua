name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e QA de assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do pipeline de assets
        run: pip install --quiet pillow numpy soundfile

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: QA de assets (obrigatório no CI)
        run: ./gradlew validateVisualAssets -PstrictAssetQa=true --no-daemon

      - name: Testes
        run: ./gradlew :core:test --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: core/build/reports/tests/test
          if-no-files-found: ignore
