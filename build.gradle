buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

configurations {
  texturePacker
}

repositories {
  mavenCentral()
}

allprojects {
  repositories {
    mavenCentral()
  }
}

dependencies {
  texturePacker "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

/*
 * QA de assets.
 *
 * O pipeline e escrito em Python e depende de Pillow e NumPy. Num clone
 * limpo essas bibliotecas nao existem, e antes disso o build inteiro
 * quebrava por causa delas - inclusive `lwjgl3:run`, que so quer abrir o
 * jogo. Os atlas ja vem versionados, entao a validacao aqui e uma rede de
 * seguranca, nao um pre-requisito: sem as dependencias ela avisa e sai.
 *
 * No CI a rigidez volta: -PstrictAssetQa=true (ou a variavel CI) faz a falta
 * de dependencia virar erro, para ninguem publicar asset quebrado.
 */
tasks.register('validateVisualAssets') {
  group = 'verification'
  description = 'Valida dimensões, grades e paleta dos assets. Pula se o Python não estiver pronto.'

  def projectRoot = rootProject.projectDir
  def strict = project.hasProperty('strictAssetQa')
    ? Boolean.parseBoolean(project.property('strictAssetQa').toString())
    : System.getenv('CI') != null

  doLast {
    def configuredPython = project.findProperty('assetQaPython')?.toString()
      ?: System.getenv('ASSET_QA_PYTHON')
    def interpreters = System.getProperty('os.name').toLowerCase().contains('windows')
      ? ['python', 'py', 'python3']
      : ['python3', 'python']
    if (configuredPython) interpreters.add(0, configuredPython)

    def runner = interpreters.find { candidate ->
      try {
        new ProcessBuilder(candidate, '-c', 'import PIL, numpy')
          .directory(projectRoot).redirectErrorStream(true).start().waitFor() == 0
      } catch (Exception ignored) {
        false
      }
    }

    if (runner == null) {
      def message = 'QA de assets pulado: Python com Pillow e NumPy não encontrado. ' +
        'Para habilitar: pip install pillow numpy soundfile'
      if (strict) throw new GradleException(message)
      logger.quiet("AVISO: $message")
      return
    }

    def process = new ProcessBuilder(runner, 'tools/prepare_visual_assets.py', '--validate-only')
      .directory(projectRoot).redirectErrorStream(true).start()
    def output = process.inputStream.text
    if (process.waitFor() != 0) {
      throw new GradleException("QA de assets falhou:\n" + output)
    }
    if (!output.trim().isEmpty()) logger.quiet(output.trim())
  }
}

def atlasGroups = [
  game: [
    'astronauta_sheet.png', 'astronaut_combat_sheet.png', 'pulse_rifle.png', 'base_lunar.png',
    'oxigenio.png', 'comida.png', 'gelo.png', 'mission_atlas_unified.png',
    'mars_atlas_v4.png', 'lunar_enemy_sheet.png', 'mars_drone_sheet.png',
    'mars_crawler_sheet.png', 'lunar_obstacles.png', 'mars_obstacles.png',
    'landmarks.png', 'titan_hunter_sheet_v3.png', 'titan_boss_sheet_v3.png',
    'campaign_portal_sheet_v2.png', 'lunar_repair_stations_v2.png', 'titan_formations_v2.png',
    'npc_colony_officer_sheet_v2.png', 'npc_commander_ayla_sheet.png', 'titan_portal_vertical_v2.png'
  ],
  ui: ['intro_keyart_v4.png', 'ui_panel_frame.png',
    'ui/panel_hud.png', 'ui/panel_dialog.png', 'ui/panel_modal.png',
    'ui/button_normal.png', 'ui/button_hover.png', 'ui/button_pressed.png', 'ui/button_disabled.png',
    'ui/bar_track.png', 'ui/bar_fill.png', 'ui/resource_icons.png',
    'ui/damage_vignette.png', 'ui/white_pixel.png', 'ui/objective_marker.png'],
  fx: ['action_fx_sheet.png', 'energy_fx_sheet.png']
]

/*
 * Assets do manifesto (docs/NEW_VISUAL_ASSETS.md) ainda não fornecidos.
 *
 * Ficam fora de atlasGroups de propósito: um nome ali que não existe em disco
 * quebraria `inputs.files` e o `copy` do TexturePacker. Aqui, em vez disso,
 * cada nome é anexado ao grupo 'game' somente se o PNG já existir - assim que
 * alguém colocar o arquivo definitivo no lugar certo e rodar
 * `packVisualAssets`, ele entra no atlas sem precisar editar este arquivo.
 */
def optionalGameAssets = [
  'mars_station_sheet_v2.png', 'titan_refinery_sheet_v2.png', 'npc_researcher_lira_sheet_v2.png'
]
optionalGameAssets.each { name ->
  if (file("assets/textures/$name").exists()) atlasGroups.game.add(name)
}

tasks.register('prepareAtlasInputs') {
  dependsOn tasks.named('validateVisualAssets')
  inputs.files(atlasGroups.values().flatten().collect { file("assets/textures/$it") })
  inputs.file(file('tools/texturepacker/pack.json'))
  inputs.file(file('tools/split_atlas_frames.py'))
  outputs.dir(layout.buildDirectory.dir('atlas-input'))
  doLast {
    delete(layout.buildDirectory.dir('atlas-input'))
    atlasGroups.each { group, names ->
      copy {
        from(file('tools/texturepacker/pack.json'))
        from(names.collect { file("assets/textures/$it") })
        into(layout.buildDirectory.dir("atlas-input/$group"))
      }
    }
    def python = project.findProperty('assetQaPython')?.toString() ?: 'python'
    def splitter = new ProcessBuilder(python, 'tools/split_atlas_frames.py',
        layout.buildDirectory.dir('atlas-input').get().asFile.absolutePath)
      .directory(rootProject.projectDir).inheritIO().start()
    if (splitter.waitFor() != 0) throw new GradleException('Falha ao separar frames do atlas.')
  }
}

def atlasTasks = atlasGroups.keySet().collect { group ->
  tasks.register("pack${group.capitalize()}Atlas", JavaExec) {
    dependsOn tasks.named('prepareAtlasInputs')
    classpath = configurations.texturePacker
    mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
    args layout.buildDirectory.dir("atlas-input/$group").get().asFile.absolutePath,
      file('assets/atlases').absolutePath, group
    inputs.dir(layout.buildDirectory.dir("atlas-input/$group"))
    outputs.file(file("assets/atlases/${group}.atlas"))
    outputs.file(file("assets/atlases/${group}.png"))
  }
}

tasks.register('packVisualAssets') {
  group = 'assets'
  description = 'Empacota sprites em game.atlas, ui.atlas e fx.atlas.'
  dependsOn atlasTasks
}

tasks.register('generateAssetList') {
    mustRunAfter atlasTasks
    // Os atlas de produção são versionados. Rodar/importar o jogo não exige Python.
    // packVisualAssets é uma tarefa explícita do fluxo de criação de arte.
    def assetsFolder = rootProject.file('assets')
    def assetsFile = rootProject.file('assets/assets.txt')
    inputs.files(fileTree(assetsFolder) { exclude 'assets.txt' })
    outputs.file(assetsFile)
    doLast {
      assetsFile.setText(fileTree(assetsFolder).matching { exclude 'assets.txt' }
        .collect { assetsFolder.relativePath(it).replace('\\', '/') }
        .sort().join('\n') + '\n', 'UTF-8')
    }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  processResources.dependsOn rootProject.tasks.named('generateAssetList')
  processResources.mustRunAfter atlasTasks

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'EchoesLua'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'EchoesLua' + '-parent'
